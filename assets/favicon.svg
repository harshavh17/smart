<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Diamond / Rhombus Base -->
  <polygon points="50,6 92,50 50,94 8,50" fill="url(#diamondGrad)" filter="url(#softGlow)" />
  
  <!-- Hexagon Circuit & Network lines -->
  <polygon points="50,24 73,37 73,63 50,76 27,63 27,37" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <circle cx="27" cy="37" r="2.5" fill="#38BDF8" />
  <circle cx="73" cy="63" r="2.5" fill="#38BDF8" />
  <circle cx="50" cy="24" r="2.5" fill="#5EEAD4" />
  <circle cx="20" cy="50" r="2" fill="#38BDF8" opacity="0.8" />
  <circle cx="80" cy="50" r="2" fill="#38BDF8" opacity="0.8" />
  <line x1="20" y1="50" x2="27" y2="37" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  <line x1="80" y1="50" x2="73" y2="63" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  
  <!-- White 3D Checkmark -->
  <path d="M 32 49 L 48 65 L 85 27 L 76 27 L 47 56 L 37 45 Z" fill="url(#checkGrad)" filter="url(#softGlow)" />
</svg>
